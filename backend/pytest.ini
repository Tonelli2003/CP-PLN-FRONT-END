[pytest]
# Usa uma pasta temporária DENTRO do projeto (evita PermissionError em %TEMP% no Windows)
addopts = --basetemp=.pytest_tmp -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    # Starlette recentes avisam que o TestClient prefere o httpx2. O filtro é por mensagem (e não pela classe do
    # aviso) para a suíte rodar também em versões antigas do Starlette, que não têm essa classe.
    ignore:Using .httpx. with .starlette.testclient.:Warning
